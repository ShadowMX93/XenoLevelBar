name: Test XenoLevelBar

on:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - .github/ci-result.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Gradle test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Run Gradle tests and build
        id: gradle
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew clean test build --no-daemon > ci-build.log 2>&1
          CODE=$?
          set -e
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          tail -n 200 ci-build.log > .github/ci-result.txt

      - name: Record CI result on branch
        if: always()
        shell: bash
        env:
          TESTED_SHA: ${{ github.sha }}
          EXIT_CODE: ${{ steps.gradle.outputs.exit_code }}
        run: |
          if [ "$EXIT_CODE" = "0" ]; then
            STATUS="PASS"
          else
            STATUS="FAIL"
          fi
          {
            echo "status=$STATUS"
            echo "tested_sha=$TESTED_SHA"
            echo "exit_code=${EXIT_CODE:-unknown}"
            echo
            cat .github/ci-result.txt 2>/dev/null || true
          } > .github/ci-result.next
          mv .github/ci-result.next .github/ci-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ci-result.txt
          git commit -m "Record CI result for $TESTED_SHA" || true
          git push origin HEAD:"$GITHUB_REF_NAME"

      - name: Fail workflow if Gradle failed
        if: steps.gradle.outputs.exit_code != '0'
        run: exit 1
