name: Build and Release XenoLevelBar

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build XenoLevelBar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Get plugin version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n "s/^version = '\([^']*\)'/\1/p" build.gradle | head -n 1)

          if [ -z "$VERSION" ]; then
            echo "Could not determine plugin version from build.gradle"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

          echo "Plugin version: $VERSION"

      - name: Check if release exists
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG will be created."
          fi

      - name: Prepare release JAR
        if: steps.release.outputs.exists == 'false'
        id: jar
        shell: bash
        run: |
          JAR="build/libs/XenoLevelBar-${{ steps.version.outputs.version }}.jar"

          if [ ! -f "$JAR" ]; then
            echo "Could not find $JAR"
            exit 1
          fi

          echo "file=$JAR" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.jar.outputs.file }}" \
            --target "$GITHUB_SHA" \
            --title "XenoLevelBar v${{ steps.version.outputs.version }}" \
            --generate-notes \
            --latest
