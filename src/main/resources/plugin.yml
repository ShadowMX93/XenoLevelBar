name: XenoLevelBar
version: '1.1.0'
main: com.xenolevelbar.XenoLevelBarPlugin
description: Displays XenoLevels progression on a separate, configurable BossBar without touching vanilla XP.
author: ShadowMX
api-version: '1.18'
depend: [PlaceholderAPI]
softdepend: [XenoLevels]

commands:
  xenolevelbar:
    description: Manage the XenoLevelBar HUD.
    usage: /<command> [toggle|status|reload|update|help]
    aliases: [xlbar, xlb]

permissions:
  xenolevelbar.use:
    description: Allows the player to see and toggle the XenoLevelBar.
    default: true
  xenolevelbar.admin:
    description: Allows reloading, updater commands and inspecting XenoLevelBar.
    default: op
