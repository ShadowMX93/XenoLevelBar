# XenoLevelBar 1.1.2
#
# XenoLevelBar never changes vanilla Minecraft XP. It only reads XenoLevels
# PlaceholderAPI values and renders them on a separate BossBar.
#
# Player-facing text is in messages.yml.
# Per-player toggle choices are stored automatically in players.yml.
# Missing settings are merged into existing config.yml files automatically.

# Internal config schema version. Do not change this manually.
config-version: 1

enabled: true

# How often the BossBar refreshes. 20 ticks = 1 second.
update-ticks: 10

# Delay before showing the HUD after a player joins.
join-delay-ticks: 10

# If XenoLevels temporarily has no user record (for example after /xlv delete),
# wait this long before asking its placeholders again. This prevents exception spam.
placeholder-failure-retry-ticks: 40

# GitHub release updater.
# Checks are asynchronous and do not block the Paper server thread.
updater:
  enabled: true

  # Check https://github.com/ShadowMX93/XenoLevelBar/releases when the plugin starts.
  check-on-startup: true

  # If an update is found, download it into Bukkit's configured update folder.
  # Paper/Bukkit installs the staged JAR on the next full server restart.
  auto-download: false

  # Notify online admins after login when a cached update is available.
  notify-admins: true

  # Timeout for GitHub API and download requests.
  timeout-seconds: 10

# "default" uses %xlv_level%, %xlv_exp%, etc.
# A named system such as "mining" uses %xlv_mining_level%, %xlv_mining_exp%, etc.
system: default

permissions:
  # Permission required to see and toggle the HUD.
  # Set to "" if you do not want a permission requirement.
  view: xenolevelbar.use

  # Permission required for /xlb reload, updater commands and console diagnostics.
  admin: xenolevelbar.admin

bossbar:
  # Built-in tokens:
  # %level% %exp% %required% %remaining% %percent% %max_level% %system%
  # Any PlaceholderAPI placeholder can also be used here.
  #
  # MiniMessage: <green>, <#D14CFF>, <gradient:red:blue>, <bold>, etc.
  # Legacy colors: &a, §a, &l, etc.
  # Legacy hex colors: &#RRGGBB (example: &#D14CFF)
  # MiniMessage and legacy codes can be used in the same value.
  title: "&#D14CFFLevel &f%level% &8• &b%exp%&7/&b%required% EXP &8(&f%percent%%&8)"

  # PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
  color: PURPLE

  # SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20
  style: SOLID

  # Optional Bukkit BossBar flags.
  # Valid: DARKEN_SKY, PLAY_BOSS_MUSIC, CREATE_WORLD_FOG
  flags: []

  # Hide the HUD if XenoLevels reports that the player reached maximum level.
  hide-at-max-level: false

visibility:
  # Empty = all worlds are eligible.
  # If this list contains worlds, ONLY these worlds may show the HUD.
  enabled-worlds: []

  # These worlds are always hidden. Case-insensitive.
  disabled-worlds: []

  # Empty = all gamemodes.
  gamemodes:
    - SURVIVAL
    - ADVENTURE
