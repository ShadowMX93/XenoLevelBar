# XenoLevelBar 1.2.0 messages
#
# Supports normal & color codes and hex colors like &#D14CFF.
# PlaceholderAPI placeholders work in messages sent to players.
# Set a single message to "" to disable it.

prefix: "&8[&#D14CFFXenoLevelBar&8] &7"

commands:
  toggle-enabled: "Your XenoLevels bar is now &aenabled&7."
  toggle-disabled: "Your XenoLevels bar is now &cdisabled&7."
  reloaded: "&aConfiguration and messages reloaded."
  no-permission: "&cYou do not have permission to do that."
  player-only: "&cOnly players can use this command."

# %label% is replaced with the command alias the sender used.
help:
  - "&8&m--------------------------------"
  - "&#D14CFFXenoLevelBar &7commands"
  - "&f/%label% toggle &8- &7Show/hide your XenoLevels bar"
  - "&f/%label% status &8- &7Show plugin and HUD diagnostics"
  - "&f/%label% reload &8- &7Reload config.yml and messages.yml"
  - "&8&m--------------------------------"

# Available status tokens:
# %version% %system% %placeholderapi_state% %xenolevels_state%
# Player-only: %placeholder_data_state% %level% %exp% %required% %remaining%
# %percent% %max_level% %hud_state% %hud_reason% %world% %gamemode%
status:
  lines:
    - "&8&m--------------------------------"
    - "&#D14CFFXenoLevelBar &f%version%"
    - "&7System: &f%system%"
    - "&7PlaceholderAPI: %placeholderapi_state%"
    - "&7XenoLevels: %xenolevels_state%"

  player-lines:
    - "&7Placeholder data: %placeholder_data_state%"
    - "&7Level: &f%level% &8| &7EXP: &f%exp%/%required% &8| &7Progress: &f%percent%%"
    - "&7World: &f%world% &8| &7Gamemode: &f%gamemode%"
    - "&7HUD: %hud_state% &8- &7%hud_reason%"

  footer:
    - "&8&m--------------------------------"

states:
  ok: "&aOK"
  no: "&cNO"
  shown: "&aSHOWN"
  hidden: "&cHIDDEN"

# These are used by /xlb status to explain why the HUD is hidden.
reasons:
  shown: "&aVisible"
  waiting-update: "&eEligible; waiting for the next HUD update"
  plugin-disabled: "&cThe plugin is disabled in config.yml"
  missing-permission: "&cMissing the HUD permission"
  player-toggle: "&cDisabled with /xlb toggle"
  world-not-enabled: "&cThis world is not in visibility.enabled-worlds"
  disabled-world: "&cThis world is disabled"
  gamemode: "&cGamemode %gamemode% is not allowed"
  invalid-data: "&cXenoLevels placeholders could not be resolved"
  xenolevels-user-unavailable: "&eXenoLevels user data is temporarily unavailable; retrying"
  max-level: "&eHidden because maximum level was reached"
  unknown: "&7Unknown"
